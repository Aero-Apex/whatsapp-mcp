[project]
name = "whatsapp-mcp-server"
version = "1.0.0"
description = "MCP server that gives Claude access to your own WhatsApp account through a local bridge."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.20,<2",
    "requests>=2.32.3",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
